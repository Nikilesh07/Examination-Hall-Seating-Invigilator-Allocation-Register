<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Examination Hall Seating System</title>

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <div class="container">

        <h1>🎓 Examination Hall Seating & Invigilator Allocation Register</h1>

        <div class="controls">
            <div class="dashboard">

    <div class="card">
        <h2 id="studentCount">0</h2>
        <p>Total Students</p>
    </div>

    <div class="card">
        <h2 id="hallCount">0</h2>
        <p>Total Halls</p>
    </div>

    <div class="card">
        <h2 id="invigilatorCount">0</h2>
        <p>Total Invigilators</p>
    </div>

</div>

            <input
                type="text"
                id="search"
                placeholder="Search Student or Register Number">

            <select id="hallFilter">

                <option value="All">All Halls</option>

                <option value="Hall A">Hall A</option>

                <option value="Hall B">Hall B</option>

                <option value="Hall C">Hall C</option>

            </select>

        </div>

        <h3 id="recordCount">

            Showing 0 Records

        </h3>

        <table>

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Register No</th>

                    <th>Subject</th>

                    <th>Hall</th>

                    <th>Seat</th>

                    <th>Session</th>

                    <th>Invigilator</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

        <br>

        <button onclick="location.href='add.html'">

            Add New Record

        </button>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
